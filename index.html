<!DOCTYPE html>
<html lang="de">
<head>

<title>IGS Mühlenberg – 3D-Modell</title>
<style>
:root{--bg:#eceef0;--fg:#2b2e33;--mut:#6b7078;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

h1{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px}
p{font-size:12px;color:var(--mut);margin:0;max-width:320px;line-height:1.4}
.btns{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap}

button:hover{background:rgba(128,128,128,.15)}
</style>

<body>
<canvas id="c"></canvas>
<div class="hud"><h1>IGS Mühlenberg</h1><p>Leonore-Goldschmidt-Schule, Mühlenberger Markt 1, Hannover. Nach Luftbild und Schrägbildern nachgebaut, Markt im Norden. Maße und Höhen geschätzt.</p></div>
<div class="btns"><button id="v1">Schrägansicht</button><button id="v2">Draufsicht</button><button id="v3">Vom Markt</button><button id="v4">Von Westen</button><button id="rot">Drehen: aus</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){

  box(.3,bh,bd,x+w/2+.05,y,z,bm(bd));box(.3,bh,bd,x-w/2-.05,y,z,bm(bd));

   for(k=0;k<n;k++){t=n>1?-bw/2+1.1+(bw-2.2)*k/(n-1):0;box(2.2,bh,.45,x+t,y,z+d/2+.1,cm);box(2.2,bh,.45,x+t,y,z-d/2-.1,cm)}
   for(k=0;k<m;k++){t=m>1?-bd/2+1.1+(bd-2.2)*k/(m-1):0;box(.45,bh,2.2,x+w/2+.1,y,z+t,cm);box(.45,bh,2.2,x-w/2-.1,y,z+t,cm)}}}}

function PR(o,c,y){[[o[0]+6,o[1]+6,o[2]-6,c[1]-4],[o[0]+6,c[3]+4,o[2]-6,o[3]-6],[o[0]+6,c[1]-4,c[0]-4,c[3]+4],[c[2]+4,c[1]-4,o[2]-6,c[3]+4]].forEach(function(a){PVR(a,y)})}

RG(B1,C1,13.2,3,cR);W(ST,8.8,2,cR);W(CN,8.8,2);RG(B2,C2,17.6,4,cO);
RG(B3,C3,13.2,3,cY);RG(B4,C4,13.2,3,cG);W(WG,9,2);RG(B5,C5,13.2,3,cB);
W([166,152,180,364],4.4,1);
W([78,55,118,78],8.8,2,cR);F([88,60,108,73],9.6,.2,gl);
// Autos im Lieferweg, Laternen, Fußweg an der Ostseite
var cm2=[0x2d3035,0xcfd2d6,0x7b8087,0x4a4f55];
for(var i=0;i<5;i++)for(var j=0;j<2;j++){if((i+j)%3==2)continue;box(1.8,1.3,4.4,X(143+j*18),.4,Z(418+i*24),mat(cm2[(i*2+j)%4]));box(1.6,.7,2.2,X(143+j*18),1.7,Z(418+i*24),band)}
[[130,10],[200,20],[260,20],[150,62],[237,62],[110,170],[110,260],[110,340],[60,350]].forEach(function(p){var x=X(p[0]),z=Z(p[1]);box(.25,6,.25,x,0,z,em);box(.9,.25,.9,x,6,z,em)});
F([296,150,306,545],0,.42,mat(0xb4b7bc));
// Eingang: kleine Erhöhung, die aus dem Dach ragt
F([180,104,212,126],9.6,2.8);F([179.5,103.5,212.5,126.5],12.4,.5,roofm);F([184,103.7,208,104.2],10.4,1.4,gl);

[[95,40,14],[62,108,14],[130,36,14],[266,66,18.4],[296,138,18.4],[200,198,14],[272,240,14],[205,300,14],[276,342,14],[186,414,14],[220,490,14],[100,140,9.6],[170,128,9.6]].forEach(function(u){F([u[0]-4,u[1]-4,u[0]+4,u[1]+4],u[2],1.2)});
// Eingang: Obergeschoss kragt über den Vorplatz, verglaster Rücksprung
var ov=rc([142,86,245,98]);F([142,86,245,98],4.4,4.4);F([141,85,246,99],8.8,.8,roofm);
box(ov.w-3,1.5,.3,ov.x,5.9,ov.z-ov.d/2-.05,band);
for(var i=0;i<5;i++)box(.7,4.4,.7,X(150+i*22),0,Z(87));
F([146,96.7,241,97.9],.4,4,mat(0x40454b));F([52,26.5,137,27.5],.4,3.4,gl);F([250,54.5,302,55.5],.4,3.4,gl);
// Farbige Fassadenpaneele (orange, gelb, blau, rot, grün)
var ac=[0xe8892b,0xf2c230,0x3f7fc4,0xd9473d,0x6aa84f].map(mat);
function AC(px,y0,y1,fl,s,sd){for(var i=0;i<fl;i++)for(var j=0;j<4;j++){if((i*3+j+s)%3)continue;box(.4,1.5,3,X(px)+sd*.2,i*(fl==4?4.4:4.4)+1.55,Z(y0+(y1-y0)*(j+.5)/4),ac[(i+j+s)%5])}}


// Sporthalle mit Dachvorsprung, Sockelband, Lüftern
var hr=rc(HL);box(hr.w,10.5,hr.d,hr.x,0,hr.z);box(hr.w+1,.8,hr.d+1,hr.x,10.5,hr.z,roofm);box(hr.w+.2,1.4,hr.d+.2,hr.x,0,hr.z,band);
box(.3,1.6,hr.d-4,hr.x+hr.w/2+.05,5.2,hr.z,band);box(.3,1.6,hr.d-4,hr.x-hr.w/2-.05,5.2,hr.z,band);
for(var k=0;k<7;k++){var zz=hr.z-hr.d/2+6+k*(hr.d-12)/6;box(.5,1.6,3,hr.x+hr.w/2+.1,5.2,zz,cB);box(.5,1.6,3,hr.x-hr.w/2-.1,5.2,zz,cB)}

function EG(a,h,inn){var r=rc(a),w=r.w+(inn?-1:1),d=r.d+(inn?-1:1),y=h+.8,t=.35;
 box(w+t,.45,t,r.x,y,r.z-d/2,em);box(w+t,.45,t,r.x,y,r.z+d/2,em);box(t,.45,d,r.x-w/2,y,r.z,em);box(t,.45,d,r.x+w/2,y,r.z,em)}
[[B1,C1,13.2],[B2,C2,17.6],[B3,C3,13.2],[B4,C4,13.2],[B5,C5,13.2]].forEach(function(e){EG(e[0],e[2]);EG(e[1],e[2],1)});
[[ST,8.8],[CN,8.8],[[78,55,118,78],8.8],[WG,9],[HL,10.5]].forEach(function(e){EG(e[0],e[1])});

for(var i=0;i<5;i++)F([87,430+i*30,91,435+i*30],11.3,1.2);

var dx=X(210),dz=Z(274),cy=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,1.4,24),white);cy.position.set(dx,1.1,dz);S.add(cy);
var dm=new THREE.Mesh(new THREE.SphereGeometry(2.4,24,12,0,Math.PI*2,0,Math.PI/2),white);dm.position.set(dx,1.8,dz);dm.castShadow=true;S.add(dm);
// Regentonne an der Nordwand des Südflügels (am Schulhof), mit fallrohr
var pfeile=[];

 var t=new THREE.Mesh(new THREE.CylinderGeometry(.5,.45,1.05,24),gm);t.position.set(bx,.4+.525,bz);t.castShadow=true;t.receiveShadow=true;S.add(t);
 [.3,.75].forEach(function(y){var r=new THREE.Mesh(new THREE.CylinderGeometry(.51,.51,.07,24),bd2);r.position.set(bx,.4+y,bz);S.add(r)});
 var lid=new THREE.Mesh(new THREE.CylinderGeometry(.52,.52,.07,24),bd2);lid.position.set(bx,.4+1.08,bz);lid.castShadow=true;S.add(lid);
 box(.14,h,.14,bx,.4,wall+dir*.35,pm3);
 box(.14,.14,.55,bx,1.35,wall+dir*.62,pm3);
 var am=new THREE.MeshBasicMaterial({color:0xffb000}),ag=new THREE.Group();
 var ak=new THREE.Mesh(new THREE.ConeGeometry(.7,1.3,4),am);ak.rotation.x=Math.PI;ak.position.y=.65;ag.add(ak);
 var as=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,1.4,12),am);as.position.y=2;ag.add(as);
 ag.position.set(bx,2.4,bz);S.add(ag);pfeile.push({g:ag,p:pfeile.length*1.7});
}
regentonne(116,362,-1,9);
regentonne(62,160,1,8.8);
// Brunnen auf dem Markt
var fo=new THREE.Mesh(new THREE.CylinderGeometry(2.8,2.8,.8,28),white);fo.position.set(X(215),.8,Z(-15));S.add(fo);
// Bäume

var tg=[mat(0x4f8a3f),mat(0x3f7a38),mat(0x5f9a4a),mat(0x477f3a)],ts=7;
